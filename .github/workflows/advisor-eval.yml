name: Advisor eval

# Manual only while the pilot runs: nightly runs were using up Gemini credit.
on:
  workflow_dispatch:
    inputs:
      subset:
        description: "retest (last failures and trick questions) or full (all questions)"
        type: choice
        options: [retest, full]
        default: retest

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run eval:advisor:retest
        if: inputs.subset == 'retest'
      - run: npm run eval:advisor
        if: inputs.subset == 'full'
