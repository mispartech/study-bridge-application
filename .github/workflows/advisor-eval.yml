name: Advisor eval

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Nightly costs less: only last run's failures and the trick questions. The full 200 is manual.
      - run: npm run eval:advisor:retest
        if: github.event_name == 'schedule'
      - run: npm run eval:advisor
        if: github.event_name != 'schedule'
